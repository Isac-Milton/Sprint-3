<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Lanchonete</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Sistema de Lanchonete</span>
        <button class="btn btn-danger" onclick="logout()">Sair</button>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">Cadastro de Produtos</h2>
        <div class="card p-4 mb-5">
            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" id="nome" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Preço</label>
                    <input type="number" id="preco" class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Categoria</label>
                    <select id="categoria" class="form-select">
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary" onclick="salvarProduto()">Salvar Produto</button>
        </div>

        <h2 class="mb-4">Produtos Cadastrados</h2>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
        </table>

        <hr class="my-5">
        <h2 class="mb-4">Cardápio</h2>

        <div id="cardapio" class="row"></div>

        <hr class="my-5">
        
        <h2 class="mb-4">Carrinho</h2>
        <div class="card p-4 shadow mb-5">
            <div id="carrinhoItens"></div>

            <hr>

            <h4>Total: R$ <span id="totalCarrinho">0</span></h4>

            <button class="btn btn-success mt-3" onclick="finalizarCompra()">Finalizar Compra</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
